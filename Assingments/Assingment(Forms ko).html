<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Detail</title>
</head>
<body>
    <h1>Student Registration Form </h1>
 
    <form action="submit">
        <label for="Name"><b>Name:</b></label>
        <input type="text" id="name" placeholder="Enter Your Name">
    &nbsp;
      
        <label for="email"><b>Email:</b></label>
        <input type="email" id="email" placeholder="Enter Email">
    &nbsp;
        <label for="Password"><b>    Password:</b></label>
        <input type="password"  placeholder="Enter Password"><br><br>  
    
        <label for="phone"><b>Phone:</b></label>
        <input type="tel" id="phone" placeholder="Enter your phone Number ">
    &nbsp;
        <lable><b>Date of Birth:</b></lable>
        <input type="date"><br><br>
    &nbsp;
        <p><b> Hobbies</b>
        <br>
        <input type="checkbox"> Drawing
        <br>
        <input type="checkbox"> Sports
        <br>
        <input type="checkbox"> Coding
        <br>
        </p>

        <p><b>Select your Gender</b>
        <br>
       <input type="radio" id="gender" value="male" >
        <label for="male">Male</label><br>
        <input type="radio" id="gender" value="female">
        <label for="female">Female</label>
        <br></p>

    
       <label>Message/Feedback/Bio/Caption</label><br>
        <textarea placeholder="Enter message/feedback/bio/caption" rows="15" cols="100"></textarea>
       <br><br>
       <button>Register</button>     

    </form>
</body>
</html>
